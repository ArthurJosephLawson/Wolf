[package]
name = "wolf"
version = "0.1.0"
description = "A local-first pixel-art productivity companion for Linux desktops."
authors = ["Wolf contributors"]
license = "MIT"
repository = "https://github.com/wolf-app/wolf"
edition = "2021"
rust-version = "1.82"

[lib]
name = "wolf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
futures-util = "0.3"
notify-rust = { version = "4", default-features = false, features = ["d"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
